<style>
/* Layout: one iPhone-sized device centered on a quiet backdrop, label strip above it. Single light theme, matching the light Figma screens. */
:root {
  --backdrop: #dde1e4;
  --page: #f6f8f9;
  --sheet: #ffffff;
  --brand: #c6002b;
  --ink: #27292d;
  --ink-2: #3f4447;
  --muted: #717276;
  --track: #e6eaed;
  --edge: #a9afb2;
  --link: #0054b7;          /* blue600 */
  --section-title: #3e4446; /* sectionTitle, grey500 */
  --desc: #707177;          /* listItemDescription, grey400 */
  --preset-bg: #ffffff;     /* presetCellBackground */
  --ios-off: rgba(120,120,128,.16);
  --ios-on: #34c759;
  --accent: #c6002b;        /* on_surface/brand */
  --emphasis: #c6002b;      /* container/emphasis */
  --on-emphasis: #ffffff;   /* text on the selected segment */
  --fab-bg: #27292d;        /* container/primary (play and pause buttons) */
  --fab-fg: #ffffff;        /* on_surface/primary_inverse */
  --edge-40: rgba(169,175,178,.4);
  --hairline: rgba(39,41,45,.06);
  --logo: #000000;          /* on_surface/brand_monochrome */
  --homebar: #000000;
  /* Tab bar and mini player progress, from production iOS (Color+Components.swift: toolbarDefault, toolbarActive, progressBar*) */
  --tab-default: #707177;   /* grey400 */
  --tab-active: #c5002b;    /* red600 */
  --progress: #cd202d;      /* red500 */
  --progress-track: #e6eaec;/* grey200 */
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, sans-serif;
  color-scheme: light;
}
/* Dark theme follows the browser or system setting (prefers-color-scheme), using the dark values from the Figma dark screens */
@media (prefers-color-scheme: dark) {
  :root {
    --backdrop: #121314;
    --page: #000000;        /* surface/app */
    --sheet: #27292d;       /* container/primary_inverse */
    --ink: #ffffff;         /* on_surface/primary */
    --ink-2: #e6eaed;       /* on_surface/secondary */
    --muted: #717276;
    --track: #3f4447;       /* container/tertiary */
    --edge: #717277;        /* container/secondary */
    --link: #75c7f7;
    --section-title: #e6eaec;
    --desc: #a9aeb1;
    --preset-bg: #3e4446;
    --ios-off: rgba(120,120,128,.32);
    --accent: #f4747c;
    --emphasis: #f4747c;
    --on-emphasis: #27292d;
    --fab-bg: #ffffff;
    --fab-fg: #27292d;
    --edge-40: rgba(113,114,119,.4);
    --hairline: rgba(255,255,255,.08);
    --logo: #ffffff;
    --homebar: #ffffff;
    --tab-default: #a9aeb1;
    --tab-active: #ffffff;
    --progress-track: #3e4446;
    color-scheme: dark;
  }
}
html, body { height: 100%; }
body {
  margin: 0; background: var(--backdrop); color: var(--ink); font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
}
* { box-sizing: border-box; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
img { display: block; max-width: 100%; }
[hidden] { display: none !important; }

.stage { height: 100%; display: flex; flex-direction: column; align-items: center; padding-block: 16px; gap: 12px; }
.label { width: min(414px, 100%); display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.label b { font-size: 15px; font-weight: 700; letter-spacing: .01em; }
.label span { font-size: 13px; color: var(--ink-2); }

.device {
  position: relative; width: min(414px, 100%); flex: 1; max-height: 896px; min-height: 0;
  background: var(--page); border-radius: 44px; overflow: hidden;
  box-shadow: 0 0 0 10px #111, 0 24px 60px rgba(0,0,0,.25);
  display: flex; flex-direction: column;
  margin-block: 10px;
}
/* On a phone the prototype fills the screen like the real app; the app's own 16px content padding is the gutter. */
@media (max-width: 480px) {
  body { padding-left: 0; padding-right: 0; background: var(--page); }
  .stage { padding-block: 0; gap: 0; }
  .label { display: none; }
  .device { width: 100%; max-height: none; border-radius: 0; box-shadow: none; margin-block: 0; }
}
@media (max-width: 400px) {
  .device .sechead { gap: 6px; }
  .device .sechead h2 { font-size: 18px; }
  .device .chip { padding: 0 8px; gap: 2px; }
  .device .chip.loc svg { display: none; }
}

/* Header */
.top { flex: none; background: var(--page); z-index: 3; }
.device[data-view="lite"] .top { background: var(--sheet); }
.status { height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 26px 0 40px; font-weight: 600; font-size: 16px; }
.status svg { display: block; }
.nav { height: 44px; display: flex; align-items: center; padding: 0 16px 0 14px; gap: 12px; }
.nav .logo { flex: none; }
.nav .spacer { flex: 1; }
.iconbtn { width: 32px; height: 32px; display: grid; place-items: center; color: var(--ink); }
.livetoggle { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink); margin-right: 4px; }
.ios { width: 40px; height: 20px; border-radius: 100px; background: var(--ios-off); padding: 2px; transition: background .2s; }
.ios i { display: block; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 3px 1px rgba(0,0,0,.06), 0 3px 8px rgba(0,0,0,.15), 0 0 0 1px rgba(0,0,0,.04); transition: transform .2s; }
.livetoggle[aria-checked="true"] .ios { background: var(--ios-on); }
.livetoggle[aria-checked="true"] .ios i { transform: translateX(20px); }

/* Views */
.views { position: relative; flex: 1; min-height: 0; }
.view { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; scrollbar-width: none; transition: opacity .15s; }
.view::-webkit-scrollbar { display: none; }
.view.fading { opacity: 0; }
.col { display: flex; flex-direction: column; gap: 16px; padding: 0 16px 24px; }

/* Controls */
.seg { padding: 6px 0; }
.seg .track { position: relative; height: 36px; border-radius: 999px; background: var(--track); display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; }
.seg .track::after { content: ""; position: absolute; inset: 0; border-radius: 999px; border: 1px solid var(--edge-40); pointer-events: none; }
.seg .pill { position: absolute; top: 4px; left: 4px; height: 28px; width: calc(50% - 6px); border-radius: 999px; background: var(--emphasis); box-shadow: 1px 1px 3px rgba(39,41,45,.12); transition: transform .25s cubic-bezier(.3,.7,.2,1); }
.seg[data-state="lite"] .pill { transform: translateX(calc(100% + 4px)); }
.seg button { position: relative; z-index: 1; height: 28px; border-radius: 999px; font-size: 14px; font-weight: 600; color: var(--ink-2); transition: color .2s; }
.seg[data-state="discover"] .b-discover, .seg[data-state="lite"] .b-lite { color: var(--on-emphasis); }
.seg.fix { padding: 4px 0; }
.seg.fix .track { height: 40px; gap: 6px; padding: 6px; box-shadow: inset 0 1px 4px rgba(0,0,0,.10); }
.seg.fix .track::after { display: none; }
.seg.fix .pill { top: 6px; left: 6px; width: calc(50% - 9px); }
.seg.fix[data-state="lite"] .pill { transform: translateX(calc(100% + 6px)); }

.tog { position: relative; height: 44px; border-radius: 999px; background: var(--sheet); display: flex; align-items: center; justify-content: center; gap: 12px; }
.tog::after { content: ""; position: absolute; inset: 0; border-radius: 999px; border: 1px solid var(--edge-40); pointer-events: none; }
.tog .lbl { font-size: 15px; font-weight: 500; color: var(--ink-2); padding: 12px 4px; }
.tog .sw { width: 51px; height: 31px; border-radius: 999px; background: var(--edge); padding: 2px; transition: background .25s; }
.tog .sw i { display: block; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 1px 1px 3px rgba(39,41,45,.12), 0 2px 6px rgba(0,0,0,.12); transition: transform .25s cubic-bezier(.3,.7,.2,1); }
.tog[data-state="lite"] .sw { background: var(--brand); }
.tog[data-state="lite"] .sw i { transform: translateX(20px); }
.noanim, .noanim * { transition: none !important; }

/* Discover */
.banner { width: 100%; aspect-ratio: 382 / 151; border-radius: 8px; object-fit: cover; }
.ad { width: 320px; max-width: 100%; aspect-ratio: 320 / 50; margin: 0 auto; }
.sec { display: flex; flex-direction: column; gap: 12px; }
.sechead { display: flex; align-items: center; gap: 8px; min-height: 32px; }
.sechead { flex-wrap: wrap; }
.sechead h2 { margin: 0; font-size: 20px; font-weight: 600; flex: 1; letter-spacing: -.01em; white-space: nowrap; color: var(--section-title); }
.sechead .ico { color: var(--ink); display: flex; }
.chip { display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 10px; border-radius: 999px; background: var(--sheet); color: var(--link); font-size: 12px; font-weight: 600; box-shadow: 0 1px 2px rgba(39,41,45,.06); white-space: nowrap; }
.row { display: flex; gap: 12px; overflow-x: auto; margin: 0 -16px; padding: 2px 16px 4px; scrollbar-width: none; scroll-snap-type: x proximity; scroll-padding-inline: 16px; }
.row::-webkit-scrollbar { display: none; }
.row > * { flex: none; scroll-snap-align: start; }
.t56 { width: 56px; height: 56px; border-radius: 6px; object-fit: cover; background: var(--preset-bg); }
.t66 { width: 66px; height: 66px; border-radius: 6px; object-fit: cover; background: var(--sheet); }
.round { border-radius: 50%; }
.dial { width: 142px; min-height: 76px; background: var(--sheet); border-radius: 8px; padding: 10px 8px 8px; display: flex; flex-direction: column; gap: 2px; position: relative; text-align: left; box-shadow: 0 1px 2px rgba(39,41,45,.06); }
.dial b { font-size: 14px; font-weight: 600; }
.dial span { font-size: 12px; color: var(--desc); padding-right: 28px; line-height: 1.3; }
.dial .play { position: absolute; right: 8px; bottom: 8px; padding: 0; display: flex; }
.wide { height: 36px; border-radius: 999px; background: var(--sheet); display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 14px; font-weight: 600; color: var(--accent); box-shadow: 0 1px 2px rgba(39,41,45,.06); width: 100%; }
.wide.ink { color: var(--ink); width: auto; padding: 0 20px; align-self: center; }
.pills { display: flex; gap: 8px; }
/* Your Library buttons: outlined pills, 1px on_surface/primary border, no fill */
.pills button { height: 36px; padding: 0 16px; border-radius: 999px; background: transparent; border: 1px solid var(--ink); font-size: 14px; font-weight: 600; color: var(--ink); }
.trendlist { display: flex; flex-direction: column; gap: 8px; }
.trend { display: grid; grid-template-columns: 40px 1fr; align-items: center; text-align: left; width: 100%; }
.trend .num { height: 40px; color: var(--accent); display: flex; align-items: center; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.trend .card { display: flex; align-items: center; gap: 8px; height: 56px; background: var(--sheet); border-radius: 6px; overflow: hidden; min-width: 0; }
.trend .card img { width: 56px; height: 56px; flex: none; object-fit: cover; }
.trend p { margin: 0; padding-right: 12px; font-size: 14px; font-weight: 600; line-height: 16px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.wide.link { height: 32px; color: var(--link); }
.rank { display: flex; align-items: flex-start; text-align: center; }
.rank .digit { height: 92px; display: flex; align-items: flex-end; color: var(--accent); margin-right: -4px; }
.rank .numeral { filter: drop-shadow(0 1px 1.5px rgba(0,0,0,.12)); }
.rank .cc { position: relative; width: 92px; display: flex; flex-direction: column; gap: 12px; }
.rank .cc img { width: 92px; height: 92px; border-radius: 6px; object-fit: cover; box-shadow: var(--shadow); }
.rank.artist .cc img { border-radius: 50%; }
.rank b { font-size: 14px; font-weight: 600; line-height: 16px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.rank small { font-size: 12px; line-height: 16px; color: var(--ink-2); margin-top: -8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cover { display: flex; flex-direction: column; justify-content: flex-end; padding: 10px; color: #fff; font-weight: 800; letter-spacing: -.01em; line-height: 1.05; font-size: 15px; text-transform: none; background: var(--c, #333); }
.cover.sm { font-size: 9px; padding: 6px; }
.cover em { font-style: normal; font-size: .62em; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; opacity: .8; margin-bottom: 4px; }
.artist .cover { align-items: center; justify-content: center; font-size: 30px; text-align: center; }

/* Lite */
.sheet { background: var(--sheet); border-radius: 0 0 24px 24px; box-shadow: 0 4px 12px rgba(39,41,45,.08); padding: 0 16px 16px; display: flex; flex-direction: column; gap: 16px; }
.art { width: min(316px, 100%); aspect-ratio: 1; margin: 0 auto; border-radius: 6px; object-fit: cover; }
.meta { display: flex; align-items: center; gap: 8px; }
.meta div { flex: 1; min-width: 0; }
.meta h3 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meta p { margin: 2px 0 0; font-size: 16px; color: var(--ink-2); }
.thumb { width: 34px; height: 34px; display: grid; place-items: center; color: var(--ink); }
.thumb.on { color: var(--accent); }
.scrub { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.scrub .bar { flex: 1; height: 3px; border-radius: 2px; background: var(--track); position: relative; }
.scrub .bar i { position: absolute; inset: 0 auto 0 0; background: var(--ink); border-radius: 2px; }
.ctrls { display: flex; align-items: center; justify-content: center; gap: 28px; }
.ctrls .big { width: 56px; height: 56px; border-radius: 50%; background: var(--fab-bg); color: var(--fab-fg); display: grid; place-items: center; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.tabs { display: flex; justify-content: space-between; padding: 8px 16px 0; }
.tabs button { font-size: 16px; font-weight: 600; padding: 10px 6px 12px; color: var(--ink); position: relative; }
/* Lite content tabs per production NewAppSlidingTabCollectionView: every title grey600 (white in dark), semibold 16;
   only the underline marks the selected tab (red600 light, red300 dark) */
.tabs button[aria-selected="false"] { color: var(--ink); font-weight: 600; }
.tabs button[aria-selected="true"]::after { content: ""; position: absolute; left: 6px; right: 6px; bottom: 4px; height: 2px; background: var(--accent); border-radius: 2px; }
.tile108 { width: 108px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
/* Lite tiles use production's cardBackground behind station art (white light, #27292C dark), per FocusModeCarouselCell */
.tile108 img, .tile108 .cover { width: 108px; height: 108px; border-radius: 6px; object-fit: cover; background: var(--sheet); }
.tile108 .round { border-radius: 50%; }
.tile108 b { font-size: 14px; font-weight: 600; line-height: 1.25; }
.tile108.now b { color: var(--accent); }
/* Empty preset slot, from the preset_button component (Show Artwork off, Show Add Icon on) */
.emptypreset { flex: none; border-radius: 6px; background: var(--track); box-shadow: 0 1px 3px rgba(0,0,0,.12); display: grid; place-items: center; color: var(--ink-2); }
.emptypreset.s56 { width: 56px; height: 56px; }
.emptypreset.s108 { width: 108px; height: 108px; }

/* Bottom */
.bottom { flex: none; background: var(--sheet); z-index: 3; }
.mini { height: 63px; display: flex; align-items: center; gap: 10px; padding: 0 8px 0 4px; position: relative; box-shadow: inset 0 -2px 0 var(--progress-track); }
.device[data-view="lite"] .mini { display: none; }
.mini img { width: 52px; height: 52px; object-fit: cover; }
.mini .txt { flex: 1; min-width: 0; font-size: 12px; line-height: 1.4; }
.mini .txt b, .mini .txt span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mini .txt b { font-weight: 600; }
.mini .prog { position: absolute; left: 0; bottom: 0; height: 2px; background: var(--progress); }
.mini .pp { width: 40px; height: 40px; border-radius: 50%; background: var(--fab-bg); color: var(--fab-fg); display: grid; place-items: center; }
/* Tab bar per production: no divider, 12pt labels, colors from production iOS toolbar tokens */
.tabbar { height: 56px; display: grid; grid-template-columns: repeat(5, 1fr); }
.tabbar div { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; color: var(--tab-default); }
.tabbar div.on { color: var(--tab-active); font-weight: 600; }
.homebar { height: 21px; display: grid; place-items: center; }
.homebar i { width: 134px; height: 5px; border-radius: 3px; background: var(--homebar); }

/* Shadows, matched to the Figma screens: the library's standard card shadow (0 1 3, black 12%) on
   tiles, cards, chips and buttons, and the Top Sheet's 0 3 5 shadow on Lite's now playing sheet. */
:root { --shadow: 0 1px 3px rgba(0,0,0,.12); }
.t56, .t66, .emptypreset, .chip, .dial, .wide, .trend .card img, .mini img, .mini .pp, .art, .ctrls .big, .tile108 img { box-shadow: var(--shadow); }
.trend .card { overflow: visible; }
.trend .card img { border-radius: 6px 0 0 6px; }
.trend .num svg { filter: drop-shadow(0 1px 1.5px rgba(0,0,0,.12)); }
.sheet { box-shadow: 0 3px 5px rgba(0,0,0,.12); }

/* Live today spacing, measured from the production screenshots: Rewind banner starts 20pt below the
   header, and the Lite album art starts 12pt below it (there is no control in between). */
.v-live #discoverCol { padding-top: 20px; }
.v-live .sheet { padding-top: 12px; }

/* Options with a control: the visible control starts 20pt below the header, matching production's first
   item, then the standard 16pt section gap to the content below. The segmented controls keep their 48pt tap
   area, so negative margins cancel the invisible padding around the visible track. */
.v-e2 .seg, .v-fix2 .seg { margin-block: -6px; }
.v-fix2 .seg.fix { margin-block: -4px; }
.v-e2 #discoverCol, .v-fix2 #discoverCol, .v-f #discoverCol, .v-f3 #discoverCol { padding-top: 20px; }
.v-e2 .sheet, .v-fix2 .sheet, .v-f .sheet, .v-f3 .sheet { padding-top: 20px; }

/* Option F3, equal halves: no gaps, each label fills its half of the pill and is centered in it, switch in the middle */
.tog.halves { gap: 0; padding: 0 6px; justify-content: stretch; }
.tog.halves .lbl { flex: 1; text-align: center; padding: 13px 0; }

@media (max-width: 480px) {
  /* On a real phone the system status bar is already there, so drop the mock one and let the header sit
     under the real one, filling the top safe area with the header color like the app does. */
  html, body { background: var(--page); }
  html[data-view="lite"], html[data-view="lite"] body { background: var(--sheet); }
  /* iOS Safari paints its top bar in a solid color only when a visible fixed bar touches the top edge;
     otherwise it fades. So on phones the header is fixed to the top, and the device is padded to match. */
  .top { position: fixed; top: 0; left: 0; right: 0; }
  .device { padding-top: calc(44px + env(safe-area-inset-top, 0px)); }
  .status { display: none; }
  .top { padding-top: env(safe-area-inset-top, 0px); }
  .bottom { padding-bottom: env(safe-area-inset-bottom, 0px); }
  .homebar { display: none; }
}

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

/* Switching between Discover and Lite */
const device = document.getElementById('device');
const views = { discover: document.getElementById('v-discover'), lite: document.getElementById('v-lite') };
const liveToggle = document.getElementById('liveToggle');
let view = 'discover';

function go(next) {
  if (next === 'toggle') next = view === 'discover' ? 'lite' : 'discover';
  if (next === view) return;
  const prev = view; view = next;
  const target = views[next];
  const ctrl = target.querySelector('[data-ctrl]');
  if (ctrl) { ctrl.classList.add('noanim'); ctrl.dataset.state = prev; }
  views[prev].hidden = true;
  target.hidden = false;
  device.dataset.view = next;
  if (typeof syncThemeColor === 'function') syncThemeColor();
  liveToggle.setAttribute('aria-checked', String(next === 'lite'));
  if (ctrl) { void ctrl.offsetWidth; ctrl.classList.remove('noanim'); requestAnimationFrame(() => { ctrl.dataset.state = next; }); }
  try { history.replaceState(null, '', location.pathname + '#' + next); } catch (e) {}
}
document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]'); if (g) { go(g.dataset.go); return; }
  if (e.target.closest('#liveToggle')) { go('toggle'); return; }
  const tab = e.target.closest('[data-tab]');
  if (tab) {
    document.querySelectorAll('[data-tab]').forEach(b => b.setAttribute('aria-selected', String(b === tab)));
    const row = document.getElementById('tiles'); row.innerHTML = tiles(tab.dataset.tab); row.scrollLeft = 0; return;
  }
  const th = e.target.closest('[data-thumb]');
  if (th) { const on = !th.classList.contains('on'); document.querySelectorAll('[data-thumb]').forEach(b => b.classList.remove('on')); th.classList.toggle('on', on); return; }
  if (e.target.closest('[data-pp]')) { playing = !playing; renderPP(); }
});
if (location.hash === '#lite') go('lite');
/* Keep Safari's top bar tint matched to the header color (page color on Discover, sheet color on Lite) in either theme */
function syncThemeColor() {
  // Header color for the current view: page color on Discover, sheet color on Lite (follows light or dark)
  document.documentElement.dataset.view = view;
  const c = getComputedStyle(document.documentElement).getPropertyValue(view === 'lite' ? '--sheet' : '--page').trim();
  document.querySelectorAll('meta[name="theme-color"]').forEach(m => { m.content = c; });
}
syncThemeColor();
document.addEventListener('click', e => { if (e.target.closest('[data-go], #liveToggle')) syncThemeColor(); });
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', syncThemeColor); } catch (e) {}

/* Playback: shared between the mini player and the Lite player */
let playing = true, pos = 49; const dur = 197;
const fmt = s => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
function renderPP() {
  document.querySelectorAll('[data-pp]').forEach(b => { b.innerHTML = playing ? I.pause : I.playArrow; b.setAttribute('aria-label', playing ? 'Pause' : 'Play'); });
}
function renderPos() {
  document.getElementById('tNow').textContent = fmt(pos);
  const pct = (pos / dur * 100).toFixed(2) + '%';
  document.getElementById('bar').style.width = pct;
  document.querySelector('.mini .prog').style.width = pct;
}
renderPP(); renderPos();
setInterval(() => { if (playing) { pos = pos >= dur ? 0 : pos + 1; renderPos(); } }, 1000);
</script>
